name: Images debug
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -A "WhereToSwim/1.0 (https://wheretoswimtoday.com)" "https://en.wikivoyage.org/w/api.php?action=query&prop=pageprops&redirects=1&format=json&formatversion=2&titles=Tenerife|Crete|Cascais" | head -c 1500; echo
          mkdir -p site/data && python pipeline/11_images.py; head -c 800 site/data/dest_images.json
