.search input:focus{border-color:var(--accent);background:#fff}
.usw{display:inline-flex;margin-left:6px;background:var(--chip);border-radius:8px;padding:2px;vertical-align:middle}.usw button{border:0;background:none;font:600 11px/1 inherit;font-family:inherit;padding:4px 6px;border-radius:6px;color:var(--muted);cursor:pointer}.usw button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}.big small .usw{margin-left:4px}

.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--accent-soft)}
.results .sub{color:var(--muted);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}

.chip{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(20,35,46,.12);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.seg{display:flex;background:var(--card);border-radius:999px;box-shadow:0 2px 8px rgba(20,35,46,.12);padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:650;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#6A5A45 50%),linear-gradient(135deg,#6A5A45 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}

/* Kausi-ilmoitus */
.notice{margin-top:4px;background:#fff8e6;border:1px solid #f1dfa6;color:#5a4a12;border-radius:12px;padding:8px 34px 8px 10px;font-size:12.5px;line-height:1.35;position:relative;box-shadow:0 2px 8px rgba(20,35,46,.08)}
.notice button{position:absolute;right:4px;top:4px;border:0;background:transparent;font-size:16px;cursor:pointer;color:#5a4a12;width:28px;height:28px}

.legend{position:fixed;left:10px;bottom:22px;z-index:900;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:calc(100vw - 20px)}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.legend .it{display:flex;align-items:center;gap:5px;white-space:nowrap}

.legend .ttl{font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.days{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.days button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-weight:500}

.layerbtn{position:fixed;right:10px;bottom:120px;z-index:950;height:44px;padding:0 14px 0 10px;border:0;border-radius:22px;background:#fff;box-shadow:var(--shadow);font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.layerbtn .ic{font-size:20px;line-height:1}
.locbtn.busy .ic{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.nlist{list-style:none;margin:0;padding:0}.nlist li{border-bottom:1px solid var(--line)}
.nlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:#fff;padding:11px 2px;font:inherit;cursor:pointer;color:var(--ink)}
.nlist button:hover{background:var(--accent-soft)}.nlist .nm{flex:1;min-width:0}.nlist .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nlist .nm span{font-size:12.5px;color:var(--muted)}.nlist .tt{font-weight:780;font-size:15px;white-space:nowrap}
.seg2{display:flex;gap:6px;margin:0 0 10px}.seg2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;color:var(--muted)}
.seg2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:1300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sh-head .x + .iconbtn{margin-left:6px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(20,35,46,.22);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:78vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
@media(min-width:760px){.sheet{left:auto;right:12px;bottom:12px;top:auto;width:400px;border-radius:18px;max-height:calc(100vh - 140px)}}
.grab{width:40px;height:4px;border-radius:2px;background:#D8CDBA;margin:8px auto 0;flex:none}
.sh-head{padding:8px 16px 10px;display:flex;gap:10px;align-items:flex-start;flex:none;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-size:18px;line-height:1.2;letter-spacing:-.01em}
.sh-head .meta{color:var(--muted);font-size:13px;margin-top:3px}
.sh-head .x{margin-left:auto}
.sh-body{overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.today{border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--accent-soft);margin-bottom:12px}
.today .big{font-size:30px;font-weight:780;letter-spacing:-.02em;line-height:1}
.today .big small{font-size:14px;font-weight:600;color:var(--muted)}
.today .txt{font-size:13.5px;line-height:1.35}
.today .txt b{display:block;font-size:14.5px;margin-bottom:2px}
.sec{margin:14px 0 0}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px;font-weight:700}
.qrow{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;color:#fff;font-weight:700;font-size:14px}
.hist{display:flex;gap:4px;margin-left:auto}
.hist span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:2px}
.hist i{width:16px;height:16px;border-radius:5px;display:block}
.note{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.bars{display:flex;gap:4px;align-items:flex-end;height:86px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;gap:3px}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:6px}
.bars .b em{font-style:normal;font-weight:700;font-size:11.5px}
.bars .b span{color:var(--muted);font-size:10.5px}
.wx{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wx div{background:var(--sand);border-radius:10px;padding:6px 2px;font-size:11px;line-height:1.3}
.wx .ic{font-size:20px;display:block;margin:2px 0}
.wx b{font-size:13px}
.wx .w{color:var(--muted);font-size:10.5px}
.events{display:flex;flex-wrap:wrap;gap:6px}
.events span{background:#fdecec;color:#8a2222;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600}
.links a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.disc{margin-top:16px;padding:10px 12px;background:var(--sand);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.45}

/* Info-ikkuna */
.modal{position:fixed;inset:0;z-index:1200;background:rgba(20,35,46,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:18px 18px 0 0;max-height:85vh;overflow-y:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;font-size:14px;line-height:1.5}

.modal h2{margin:0 0 8px;font-size:19px}
.modal h3{margin:16px 0 4px;font-size:14px}
.modal p,.modal li{color:#2A3B47}
.modal ul{padding-left:18px;margin:4px 0}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2000;background:var(--sea);font-weight:650;color:var(--muted);font-size:15px}

  info:`<h2>Where to Swim (beta)</h2>
  <p>Kartta näyttää jokaiselle EU-uimavedelle virallisen laatuluokan, viimeisimmän avoimen näytteen, veden lämpötilan tänään ja viikon ennusteen sekä sään. Betaversiossa ovat kaikki 22 289 virallista uimavettä 29 Euroopan maasta. Näytetulokset ovat toistaiseksi mukana Ranskalle, muita maita lisätään.</p>

  <li><b>Laatuluokka:</b> Euroopan ympäristökeskus EEA, uimavesidirektiivin raportointi, kausi 2025.</li>

  <li><b>Pohjakartta:</b> Natural Earth. Kunnat (Suomi): Tilastokeskus.</li></ul>
  <h3>Näin luet laatuluokkaa</h3>
  <p>EU:n luokitus (erinomainen, hyvä, tyydyttävä, huono) lasketaan neljän viime kauden bakteerinäytteistä. Se kertoo rannan pitkän aikavälin tason, ei tämän päivän tilannetta.</p>

  <p>Tiedot ovat suuntaa antavia suosituksia, eivät uimalupa. Käyttäjä vastaa itse uimisesta. Noudata aina rannan paikallisia lippuja, uimakieltoja ja hengenpelastajien ohjeita. Mallin lämpötila voi poiketa rannan todellisesta lämpötilasta.</p>`

  info:`<h2>Where to Swim (Beta)</h2>
  <p>Eine Karte, die für jedes offizielle EU-Badegewässer die Qualitätsklasse, die letzte öffentliche Probe, die heutige Wassertemperatur mit Wochenvorhersage und das Wetter zeigt. Die Beta umfasst alle 22.289 offiziellen Badegewässer in 29 europäischen Ländern. Probenergebnisse gibt es bisher für Frankreich, weitere Länder folgen.</p>
  <h3>Datenquellen</h3><ul>
  <li><b>Qualitätsklasse:</b> Europäische Umweltagentur (EEA), Berichterstattung nach der Badegewässerrichtlinie, Saison 2025.</li>

  <li><b>Seetemperatur (Finnland):</b> Finnisches Umweltinstitut Syke, Hydrologie-API (CC BY 4.0).</li>
  <li><b>Wetter:</b> MET Norway Locationforecast (CC BY 4.0).</li>
  <li><b>Grundkarte:</b> Natural Earth. Gemeinden (Finnland): Statistik Finnland.</li></ul>
  <h3>So lesen Sie die Qualitätsklasse</h3>
  <p>Die EU-Klasse (ausgezeichnet, gut, ausreichend, mangelhaft) wird aus Bakterienproben der letzten vier Saisons berechnet. Sie beschreibt das langfristige Niveau der Badestelle, nicht die heutige Lage.</p>
  <h3>Haftungsausschluss</h3>
  <p>Die Angaben sind unverbindlich und keine Badeerlaubnis. Baden erfolgt auf eigene Gefahr. Beachten Sie immer die Flaggen, Badeverbote und Anweisungen der Rettungsschwimmer vor Ort. Modellierte Temperaturen können von der tatsächlichen Temperatur am Strand abweichen.</p>`
},

  info:`<h2>Where to Swim (bêta)</h2>

let D0 = 0;   // tämän päivän indeksi lämpötilaennusteessa
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title = s => s.toLowerCase().replace(/(^|[\s\-'(/])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());

let S=[], T=null, markers=[], mode="q", day=0, filt={exc:false,sea:false,fresh:false}, current=-1, sat=false, baseLayer=null;
const map = L.map("map",{zoomControl:false,preferCanvas:true,minZoom:3,maxZoom:12,attributionControl:true,worldCopyJump:false,maxBoundsViscosity:1});
// Kartta ei saa karata pois näkyvistä: rajataan Eurooppaan (Kanariat, Azorit, Kypros mukana).
// Kun käyttäjä siirtyy merentakaiseen kohteeseen (esim. Guadeloupe, Réunion), rajat vaihdetaan sen alueen ympärille.
const EUB = L.latLngBounds([[25,-34],[72,48]]);
function allowFor(b){
  b = L.latLngBounds(b);
  if (EUB.contains(b)) return map.setMaxBounds(EUB);
  const cur = map.options.maxBounds;
  if (cur && cur.contains(b)) return;
  const reg = Object.values(REG).map(r=>L.latLngBounds(r)).find(r=>!EUB.contains(r) && r.pad(.5).contains(b));
  map.setMaxBounds(reg ? reg.pad(1.5) : L.latLngBounds([[b.getSouth()-5,b.getWest()-5],[b.getNorth()+5,b.getEast()+5]]));
}
["fitBounds","flyToBounds"].forEach(f=>{ const o=map[f].bind(map); map[f]=(b,...a)=>{ allowFor(b); return o(b,...a); }; });
["setView","flyTo"].forEach(f=>{ const o=map[f].bind(map); map[f]=(c,...a)=>{ if(c) allowFor([c,c]); return o(c,...a); }; });
map.setMaxBounds(EUB);
map.attributionControl.setPrefix(false).addAttribution("Natural Earth · EEA · Copernicus Marine · Syke · MET Norway · data.gouv.fr");
const rend = L.canvas({padding:.3,tolerance:9});
map.createPane("base"); map.getPane("base").style.zIndex = 250;   // vektoripohjakartta aina pallojen alla
const baseRend = L.canvas({pane:"base", padding:.3});
map.fitBounds(REG.eu);

// lämpötila: meri (malli, päiväkohtainen) tai järvi (viimeisin havainto)
function tempOf(i, d=day){ const x=T.sst[i]; if(x) return x[0][d]; const l=T.lake[i]; return l? l[0][l[0].length-1][1] : null; }

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = String(L_()[el.dataset.t]).replace("°C",U()); });
  document.getElementById("q").placeholder = L_().search;
  document.getElementById("langSel").value = LANG; document.getElementById("langCode").textContent = LANG.toUpperCase();
  document.getElementById("warmLink").href = LANG==="fi" ? "/fi/lammin-meri-nyt/" : "/warm-sea-now/";
  document.getElementById("cLink").href = PFX()+"/beaches/";
  document.getElementById("avantoLink").style.display = LANG==="fi" ? "" : "none";
  const PRIVL={en:"Privacy policy",fi:"Tietosuojaseloste",de:"Datenschutzerklärung",fr:"Politique de confidentialité",es:"Política de privacidad",it:"Informativa sulla privacy",nl:"Privacyverklaring"};
  document.getElementById("modalBody").innerHTML = L_().info + `<p style="margin-top:10px"><a href="${PFX()}/privacy/">${PRIVL[LANG]}</a></p>`;
  if(typeof satLabel==="function") try{ satLabel(); }catch(e){}
  document.getElementById("locTxt").textContent = L_().near;
  buildRegions();
  if(T){ stamp(); restyle(); if(current>=0) openSheet(current,false); }
}
function buildRegions(){
  const sel = document.getElementById("region"), v = sel.value || "eu", r=L_().reg;
  const cs = COUNTRIES.slice().sort((a,b)=>cname(a).localeCompare(cname(b), LANG));
  sel.innerHTML = `<option value="eu">${r.eu}</option>` + cs.map(cc => !SUBREG[cc] ? `<option value="c_${cc}">${cname(cc)}</option>`
     : `<optgroup label="${cname(cc)}"><option value="c_${cc}">${cname(cc)} – ${r.whole}</option>`+SUBREG[cc].map(k=>`<option value="${k}">${r[k]}</option>`).join("")+`</optgroup>`).join("");
  sel.value = [...sel.options].some(o=>o.value===v) ? v : "eu";
}
function sampleVerdict(s, smp){
  if(!smp) return null; const num=x=>x==null?null:parseFloat(String(x).replace("<",""));
  const ec=num(smp[1]), ei=num(smp[2]); if(ec==null&&ei==null) return null;
  const sea = s[3]==="C"||s[3]==="T"; const lim = sea?[1000,370]:[1800,660];
  if((ec??0)>lim[0]||(ei??0)>lim[1]) return {t:L_().sv.bad,c:"#8E2A12"};
  if((ec??0)<=100&&(ei??0)<=100) return {t:L_().sv.good,c:"#0B63A8"};
  return {t:L_().sv.avg,c:"#D9822B"};
}
function waterWord(t){ if(t==null) return null; const w=L_().ww;
  return t>=24?w[5]: t>=20?w[4]: t>=17?w[3]: t>=14?w[2]: t>=8?w[1]: w[0]; }
function radius(){ const z=map.getZoom(); return (z<=4?2.2: z<=5?2.6: z<=6?3.4: z<=8?4.6: z<=10?6: z<=13?7.5: 9) + (sat?1:0); }
function visible(i){ const s=S[i];
  if(filt.exc && s[6][0]!=="E") return false;
  const sea = s[3]==="C"||s[3]==="T";
  if(filt.sea && !filt.fresh && !sea) return false;
  if(filt.fresh && !filt.sea && sea) return false;
  return true; }
function colorOf(i){ return mode==="q" ? QC[S[i][6][0]] : tempColor(tempOf(i)); }
function restyle(){
  const r=radius(); let n=0;
  markers.forEach((m,i)=>{ const v=visible(i); if(v) n++;
    const noTemp = mode==="t" && tempOf(i)==null;
    m.setStyle({radius: noTemp? r*0.6 : r, fillColor: colorOf(i), color: i===current? (sat?"#ffeb3b":"#0F2533"):"#ffffff", weight: i===current?3:(sat?2:1), opacity: v?1:0, fillOpacity: v?(noTemp?.55:.95):0});
    if(i===current && v) m.bringToFront(); });
  legend(n);
}
function placeLayerBtn(){ const lg=document.getElementById("legend"), b=document.getElementById("satBtn");
  const wide = window.innerWidth>=760, base = wide ? 22 : lg.offsetHeight+30; b.style.bottom = base+"px";
  const lb=document.getElementById("locBtn"); if(lb) lb.style.bottom = (base+52)+"px"; }
window.addEventListener("resize", placeLayerBtn);
function legend(n){
  lastN=n;
  const el=document.getElementById("legend"), t=L_(), cnt=`<span class="count">${n.toLocaleString(LOCS[LANG])} ${t.beaches}</span>`;
  if(mode==="q"){
    el.innerHTML = `<div class="ttl">${t.legQ} ${cnt}</div><div class="row">`+
      ["E","G","S","P","N"].map(k=>`<span class="it"><span class="dot" style="background:${QC[k]}"></span>${t.q[k]}</span>`).join("")+`</div>`;
  } else {
    el.innerHTML = `<div class="ttl">${t.legT.replace("°C",U())} ${cnt} ${unitSw()}</div><div class="row">`+
      TBANDS.map(([l,c],k)=>[UNIT==="F"? (k===0?"<"+t0(6):k===7?t0(27)+"+":t0(TB[k-1][0])+"–"+t0(TB[k][0])) : l, c]).map(([l,c])=>`<span class="it"><span class="dot" style="background:${c}"></span>${l}</span>`).join("")+
      `<span class="it"><span class="dot" style="background:#c3cacf;width:7px;height:7px"></span>${t.noTemp}</span></div><div class="days">`+
      T.sst_dates.map((d,i)=>i<D0?"":`<button data-d="${i}" class="${i===day?"on":""}">${dayLbl(d)}</button>`).join("")+`</div>`;
    bindUnit(el);
    el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{day=+b.dataset.d; restyle(); if(current>=0) openSheet(current,false);});
  }
  placeLayerBtn();
}
function bars(vals, labels, hi){
  const mn=Math.min(...vals)-1.5, mx=Math.max(...vals)+.5;
  return `<div class="bars">`+vals.map((t,k)=>`<div class="b"><em>${tv(t)}</em><i style="height:${Math.max(8,(t-mn)/(mx-mn||1)*60)}px;background:${tempColor(t)};${k===hi?"outline:2px solid #0F2533;outline-offset:1px":""}"></i><span>${labels[k]}</span></div>`).join("")+`</div>`;
}
function openSheet(i, pan=true){
  current=i; const t=L_(), s=S[i], x=T.sst[i], lk=T.lake[i], wxi=T.wx_cell[i], wx = wxi!=null? T.wx[wxi]: null;
  document.getElementById("shName").textContent = title(s[1]);
  document.getElementById("shMeta").textContent = [s[2], t.type[s[3]], cname(s[10])].filter(Boolean).join(" · ");
  const wxNow = wx? wx.filter(r=>r[0]>=TODAY) : null, qk=s[6][0], qn=t.q[qk], tNow=tempOf(i,D0), w0=wxNow&&wxNow.length?wxNow[0]:null;
  const air = w0? t.airNow(t0(w0[1]), WX(w0[5]), wind(w0[3])) : "";
  let h="";
  const qtxt = qk==="E"||qk==="G" ? t.qGood(qn) : qk==="P" ? t.qPoor : t.qOther(qn);
  if(tNow!=null){
    h+=`<div class="today" style="background:${tempColor(tNow)}1f"><div class="big">${t0(tNow)}<small>${unitSw()}</small></div><div class="txt"><b>${waterWord(tNow)}</b>${!x&&lk?t.measured(fmtD(lk[0][lk[0].length-1][0])):""}${qtxt}${air}</div></div>`;
  } else {
    h+=`<div class="today" style="background:var(--sand)"><div class="txt"><b>${qn} (EU 2025)</b>${t.noTempYet}${air}</div></div>`;
  }
  const yrs=[2025,2024,2023,2022,2021];
  h+=`<div class="sec"><h3>${t.secQ}</h3><div class="qrow"><span class="badge" style="background:${QC[qk]};color:${qk==="G"||qk==="-"||qk==="N"?"#0F2533":"#fff"}">${qn}</span><div class="hist">`+
     yrs.map((y,k)=>`<span><i style="background:${QC[s[6][k]]||"#d7dcdf"}" title="${y}: ${t.q[s[6][k]]||""}"></i>${String(y).slice(2)}</span>`).reverse().join("")+
     `</div></div><div class="note">${t.qNote}</div></div>`;
  const smp=s[8], v=sampleVerdict(s,smp);
  h+=`<div class="sec"><h3>${t.secS}</h3>`;
  if(smp){
    const fv = x => String(x??"–").replace("<","< ");
    h+=`<dl class="kv"><dt>${t.sDate}</dt><dd>${fmtDL(smp[0])} ${v?`<span class="pill" style="background:${v.c}22;color:${v.c}">${v.t}</span>`:""}</dd>`+
       `<dt>${t.sEc}</dt><dd>${fv(smp[1])} <span class="count">${t.per}</span></dd><dt>${t.sEi}</dt><dd>${fv(smp[2])} <span class="count">${t.per}</span></dd></dl>`+
       `<div class="note">${t.sNoteFR}</div>`;
  } else h+=`<div class="note">${s[10]==="FI"?t.sNoneFI:t.sNone}</div>`;
  if(s[9]){ h+=`<div class="sec" style="margin-top:10px"><h3>${t.secEv}</h3><div class="events">`+
     Object.entries(s[9]).map(([k,n])=>`<span>${t.ev[k]||k}${n>1?` ×${n}`:""}</span>`).join("")+`</div></div>`; }
  h+=`</div>`;
  if(x){
    h+=`<div class="sec"><h3>${t.secSst}</h3>`+bars(x[0].slice(D0), T.sst_dates.slice(D0).map(d=>dayLbl(d)), day-D0)+`<div class="note">${t.sstNote(nf(x[1]))}</div></div>`;
  } else if(lk){
    h+=`<div class="sec"><h3>${t.secLake}</h3>`+bars(lk[0].map(o=>o[1]), lk[0].map(o=>fmtD(o[0])), lk[0].length-1)+`<div class="note">${t.lakeNote(esc(lk[1]), nf(lk[2]))}</div></div>`;
  }
  if(wxNow&&wxNow.length){
    h+=`<div class="sec"><h3>${t.secWx}</h3><div class="wx" style="grid-template-columns:repeat(${wxNow.length},1fr)">`+
       wxNow.map((r,k)=>`<div><span>${r[0]===TODAY?t.today:t.dow[D(r[0]).getDay()]}</span><span class="ic">${WX(r[5])}</span><b>${t0(r[1])}°</b><div class="w">${wind(r[3])}${r[4]>=0.5?`<br>${r[4].toFixed(0)} mm`:""}</div></div>`).join("")+`</div></div>`;
  }
  if(s[7]){ const url = /^https?:/i.test(s[7]) ? s[7] : (s[10]==="FR" ? "https://baignades.sante.gouv.fr/baignades/profil.do?"+s[7] : "https://"+s[7]);
    h+=`<div class="sec links"><a href="${esc(url)}" target="_blank" rel="noopener">${t.profile}</a></div>`; }
  h+=`<div class="disc">${t.disc}</div>`;
  document.getElementById("shBody").innerHTML=h;
  bindUnit(document.getElementById("shBody"));
  if(pan) document.getElementById("shBody").scrollTop=0;
  document.getElementById("shShare").style.display=""; document.getElementById("sheet").style.maxHeight="";
  setUrl(i); document.title = title(s[1]) + (s[2] ? ", " + s[2] : "") + " – Where to Swim";
  const sh=document.getElementById("sheet"); sh.classList.add("open"); sh.setAttribute("aria-hidden","false");
  restyle();
  if(pan){ const ll=L.latLng(s[4],s[5]); const z=Math.max(map.getZoom(), sat?15:10);
    const off = window.innerWidth<760 ? map.getSize().y*0.22 : 0;
    const p = map.project(ll,z).add([window.innerWidth>=760?200:0, off]); map.flyTo(map.unproject(p,z), z, {duration:.6}); }
}
function closeSheet(){ const sh=document.getElementById("sheet"); sh.classList.remove("open"); sh.setAttribute("aria-hidden","true"); current=-1; restyle(); setUrl(null); }
const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function beachUrl(i){ const s=S[i]; return location.origin + PFX() + "/beach/" + encodeURIComponent(s[0]) + "/" + slug(title(s[1]) + (s[2] ? " " + s[2] : "")); }
function setUrl(i){ try { history.replaceState(null, "", PFX() + (i==null ? "/" : "/?b=" + encodeURIComponent(S[i][0]))); } catch(e){} }
// Oma sijainti ja lähimmät uimapaikat
let me=null, meLayer=null, nearSort="dist", AV=null;
const nearRefresh = () => { const sh=document.getElementById("sheet"); if(me && current<0 && sh.classList.contains("open")) showNear(); };
function hav(a,b,c,d){ const R=6371, r=Math.PI/180, x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function showNear(){
  const t=L_(); if(!me) return;
  const sh0=document.getElementById("sheet"); sh0.style.maxHeight = window.innerWidth<760 ? "55vh" : "";
  if(nearSort==="av"){ return showAvanto(); }
  let near=[]; for(let i=0;i<S.length;i++){ if(!visible(i)) continue; const d=hav(me[0],me[1],S[i][4],S[i][5]); if(d<=100) near.push([i,d]); }
  near.sort((a,b)=>a[1]-b[1]); near=near.slice(0,40);
  const QR={E:0,G:1,S:2,P:3,N:4,"-":5};
  if(nearSort==="warm") near.sort((a,b)=>(tempOf(b[0],D0)??-99)-(tempOf(a[0],D0)??-99));
  if(nearSort==="best") near.sort((a,b)=>(QR[S[a[0]][6][0]]-QR[S[b[0]][6][0]])||a[1]-b[1]);
  near=near.slice(0,15);
  current=-1; document.getElementById("shShare").style.display="none";
  document.getElementById("shName").textContent=t.nearTitle; document.getElementById("shMeta").textContent="";
  let h=segHtml();
  h+= near.length ? `<ul class="nlist">`+near.map(([i,d])=>{ const s=S[i], tt=tempOf(i,D0);
      return `<li><button data-i="${i}"><span class="dot" style="background:${QC[s[6][0]]}"></span><span class="nm"><b>${esc(title(s[1]))}</b><span>${esc([s[2], t.type[s[3]]].filter(Boolean).join(" · "))} · ${nf(d, d<10?1:0)} ${t.km}</span></span><span class="tt" style="color:${tempColor(tt)}">${tt!=null?t0(tt)+" "+U():"–"}</span></button></li>`; }).join("")+`</ul>`
    : `<p class="note">${t.noneNear}</p>`;
  h+=`<div class="disc">${t.disc}</div>`;
  const body=document.getElementById("shBody"); body.innerHTML=h; body.scrollTop=0;
  body.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ nearSort=b.dataset.s; showNear(); });
  body.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ document.getElementById("shShare").style.display=""; openSheet(+b.dataset.i); });
  const sh=document.getElementById("sheet"); sh.classList.add("open"); sh.setAttribute("aria-hidden","false"); restyle();
}
function segHtml(){ const t=L_(); const opts=[["dist",t.sortDist],["warm",t.sortWarm],["best",t.sortBest]];
  if(me && me[0]>59.5 && me[0]<70.2 && me[1]>19 && me[1]<31.6) opts.push(["av",t.sortAv]);   // avannot vain Suomessa
  return `<div class="seg2" style="flex-wrap:wrap">${opts.map(([k,l])=>`<button data-s="${k}" class="${nearSort===k?"on":""}">${l}</button>`).join("")}</div>`; }
async function showAvanto(){
  const t=L_(), body=document.getElementById("shBody");
  if(!AV){ try{ AV = await (await fetch("/data/avanto.json")).json(); }catch(e){ AV=[]; } }
  const near = AV.map(a=>[a, hav(me[0],me[1],a[4],a[5])]).sort((x,y)=>x[1]-y[1]).slice(0,15);
  let h=segHtml()+`<ul class="nlist">`+near.map(([a,d])=>`<li><a href="/fi/avanto/${a[3]}/#p${a[0]}" style="display:flex;align-items:center;gap:10px;padding:11px 2px;color:var(--ink);text-decoration:none">
     <span style="font-size:18px">❄️</span><span class="nm"><b>${esc(a[1])}</b><span>${esc(a[2])} · ${nf(d, d<10?1:0)} ${t.km}${a[6]?" · "+t.sauna:""}</span></span>
     <span class="tt" style="color:${tempColor(a[7])}">${a[7]!=null?tv(a[7])+" "+U():""}</span></a></li>`).join("")+`</ul>`;
  h+=`<p class="note">Lipas.fi (Jyväskylän yliopisto, CC BY 4.0)</p>`;
  body.innerHTML=h; body.scrollTop=0;
  body.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ nearSort=b.dataset.s; showNear(); });
  current=-1; document.getElementById("shShare").style.display="none";
  document.getElementById("shName").textContent=t.sortAv.replace("❄️ ",""); document.getElementById("shMeta").textContent="";
  const sh=document.getElementById("sheet"); sh.classList.add("open"); sh.setAttribute("aria-hidden","false");
}
function locate(){
  const t=L_(), btn=document.getElementById("locBtn");
  if(!navigator.geolocation){ toast(t.locNo); return; }
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove("busy"); me=[pos.coords.latitude, pos.coords.longitude];
    if(meLayer) map.removeLayer(meLayer);
    meLayer=L.layerGroup([
      L.circle(me,{radius:Math.min(pos.coords.accuracy,2000),color:"#0F2533",weight:1,fillColor:"#0F2533",fillOpacity:.06,interactive:false}),
      L.circleMarker(me,{radius:14,stroke:false,fillColor:"#0F2533",fillOpacity:.18,interactive:false}),
      L.circleMarker(me,{radius:8,color:"#fff",weight:3,fillColor:"#0F2533",fillOpacity:1,interactive:false})]).addTo(map);
    const near=S.map((s,i)=>[i,hav(me[0],me[1],s[4],s[5])]).filter(x=>visible(x[0])).sort((a,b)=>a[1]-b[1]).slice(0,5);
    const pts=[me, ...near.filter(x=>x[1]<60).map(x=>[S[x[0]][4],S[x[0]][5]])];
    if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:13, paddingBottomRight:[0, window.innerWidth<760? map.getSize().y*0.55:0]}); else map.setView(me,10);
    showNear();
  }, ()=>{ btn.classList.remove("busy"); toast(t.locErr); }, {enableHighAccuracy:false, timeout:12000, maximumAge:300000});
}
document.getElementById("locBtn").onclick=locate;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 1800); }
document.getElementById("shShare").onclick = async () => {
  if(current<0) return; const s=S[current], t=L_(), url=beachUrl(current);
  const text = t.shareText(title(s[1]) + (s[2] ? ", " + s[2] : ""), tempOf(current,D0), t.q[s[6][0]]);
  if(navigator.share){ try { await navigator.share({title: title(s[1]) + " – Where to Swim", text, url}); return; } catch(e){ if(e && e.name==="AbortError") return; } }
  try { await navigator.clipboard.writeText(text + " " + url); toast(t.copied); } catch(e){ toast(url); }
};
function stamp(){ const f=new Date(T.wx_fetched), loc=LOCS[LANG];
  document.getElementById("stamp").textContent = L_().stamp(f.toLocaleDateString(loc), f.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"}), fmtD(T.sst_dates[0]), fmtD(T.sst_dates[T.sst_dates.length-1])); }

// Haku
const qi=document.getElementById("q"), res=document.getElementById("results");
let norm=[], normName=[], normCom=[];
const N = s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
qi.addEventListener("input",()=>{
  const v=N(qi.value.trim()); if(v.length<2){res.style.display="none";return;}
  const score=i=> normCom[i]===v?0 : normCom[i].startsWith(v)?1 : normName[i].startsWith(v)?2 : (" "+normName[i]).includes(" "+v)?3 : 4;
  const hits=[]; for(let i=0;i<S.length;i++){ if(norm[i].includes(v)) hits.push(i); }
  hits.sort((a,b)=>score(a)-score(b));
  const t=L_();
  res.innerHTML = hits.slice(0,10).map(i=>{ const tt=tempOf(i,D0); return `<button data-i="${i}"><span class="dot" style="background:${QC[S[i][6][0]]}"></span><span>${esc(title(S[i][1]))}<div class="sub">${[S[i][2], cname(S[i][10]), t.type[S[i][3]]].filter(Boolean).map(esc).join(" · ")}${tt!=null?` · ${t0(tt)} ${U()}`:""}</div></span></button>`; }).join("") || `<button disabled><span class="sub">${t.none}</span></button>`;
  res.style.display="block";
  res.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{res.style.display="none"; qi.blur(); openSheet(+b.dataset.i);});
});
qi.addEventListener("blur",()=>setTimeout(()=>res.style.display="none",200));

document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll("#mode button").forEach(x=>x.classList.toggle("on",x===b)); restyle(); });
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ filt[b.dataset.f]=!filt[b.dataset.f]; b.classList.toggle("on",filt[b.dataset.f]); restyle(); });
document.getElementById("region").onchange=e=>{ closeSheet(); map.flyToBounds(REG[e.target.value],{duration:.7,padding:[10,10],maxZoom:10}); };
document.getElementById("shX").onclick=closeSheet;
(function(){ const sel=document.getElementById("langSel"); sel.innerHTML=LANGS.map(l=>`<option value="${l}">${l.toUpperCase()} · ${LNAME[l]}</option>`).join(""); sel.value=LANG;
  sel.onchange=()=>{ const nl=sel.value; store.set("bwt_lang",nl); const b=current>=0?"?b="+encodeURIComponent(S[current][0]):location.search; location.href=(nl==="en"?"":"/"+nl)+"/"+(b||""); }; })();
const modal=document.getElementById("modal");
document.getElementById("infoBtn").onclick=()=>modal.classList.add("open");
document.getElementById("modalX").onclick=()=>modal.classList.remove("open");
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("open"); };
const notice=document.getElementById("notice");
if(store.get("bwt_notice")==="1") notice.style.display="none";
document.getElementById("noticeX").onclick=()=>{ notice.style.display="none"; store.set("bwt_notice","1"); };
map.on("zoomend",restyle);
// Satelliittikuva: Esri World Imagery + paikannimet. Tuotannossa tähän tarvitaan ArcGIS Location Platformin API-avain.
const SAT_ATTR = "Imagery © Esri, Maxar, Earthstar Geographics";
const satLayer = L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:18, maxNativeZoom:18, attribution:SAT_ATTR}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom:18, maxNativeZoom:18, opacity:.9})
]);
function setSat(on){
  sat = on; satLabel(); store.set("bwt_sat", on?"1":"0");
  if(on){ if(baseLayer) map.removeLayer(baseLayer); satLayer.addTo(map); map.setMaxZoom(18); document.getElementById("map").style.background="#0b1d2a"; }
  else { map.removeLayer(satLayer); if(baseLayer) baseLayer.addTo(map); if(map.getZoom()>12) map.setZoom(12); map.setMaxZoom(12); document.getElementById("map").style.background=""; }
  satLayer.eachLayer(l=>l.bringToBack && l.bringToBack()); restyle();
}
document.getElementById("satBtn").onclick=()=>setSat(!sat);
function satLabel(){ document.getElementById("satBtn").innerHTML = sat ? `<span class="ic">🗺️</span>${L_().mapv}` : `<span class="ic">🛰️</span>${L_().sat}`; }
map.on("click",()=>{ if(current>=0) closeSheet(); });
applyLang();
document.getElementById("loading").textContent = L_().loading;

Promise.all(["/data/basemap.json","/data/sites.json","/data/today.json"].map(u=>fetch(u).then(r=>{if(!r.ok) throw new Error(u); return r.json();})))
.then(([bm,sites,today])=>{
  S=sites; T=today; normName=S.map(s=>N(s[1])); normCom=S.map(s=>N(s[2])); norm=S.map((s,i)=>normName[i]+" "+normCom[i]);
  baseLayer = L.geoJSON(bm,{interactive:false, renderer:baseRend, pane:"base",style:f=> f.properties.k==="lake" ? {stroke:false,fillColor:"#d5e9f3",fillOpacity:1}
       : {color:"#c9c2b3",weight:.7,fillColor:f.properties.c?"#f6f3ec":"#ece8df",fillOpacity:1}});
  if(store.get("bwt_sat")==="1") setSat(true); else baseLayer.addTo(map);
  markers = S.map((s,i)=>L.circleMarker([s[4],s[5]],{renderer:rend,radius:radius(),weight:1,color:"#fff",fillOpacity:.95,fillColor:colorOf(i)})
      .on("click",e=>{ L.DomEvent.stopPropagation(e); openSheet(i); }).addTo(map));
  countryBounds(); buildRegions();
  D0 = Math.max(0, T.sst_dates.indexOf(TODAY)); day = D0;
  if(TODAY > T.sst_dates[T.sst_dates.length-1] || T.sst_dates.indexOf(TODAY) < 0){   // data vanhentunut
    const n=document.getElementById("notice"); n.style.display=""; n.querySelector("span").textContent = L_().stale(fmtDL(T.wx_fetched.slice(0,10))); }
  restyle(); stamp();
  document.getElementById("loading").remove();
  // syvälinkki: /?b=ID tai /beach/ID/nimi
  const m = location.pathname.match(/^(?:\/[a-z]{2})?\/beach\/([^/]+)/), want = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get("b");
  if(want){ const i = S.findIndex(s=>s[0]===want); if(i>=0){ map.setView([S[i][4],S[i][5]], sat?15:11); openSheet(i); } }
}).catch(err=>{ document.getElementById("loading").textContent=L_().fail; console.error(err); });
})();
</script>
</body>
</html>
